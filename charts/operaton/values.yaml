# Default values for operaton.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

general:
  # Enables debug mode. For tomcat and wildfly, JPDA is accessible under port 8000,
  # for operaton, it enables Spring Boot's debug output.
  debug: false
  replicaCount: 1
  nameOverride: ""
  fullnameOverride: ""

# Set deployment initContainers for any pre-startup proposes.
initContainers: []

# Deployment annotations
annotations: {}

# Custom labels to add to all deployed objects
commonLabels: {}
# Example
#  my-custom-label: my-value

# Operaton distribution: "operaton" (Spring Boot based standalone distribution),
# "tomcat" or "wildfly". It selects the default image repository and the
# distribution specific configuration of the container.
# For more details: https://github.com/operaton/operaton-docker#distributions
distribution: operaton

image:
  # Defaults to "operaton/<distribution>" when empty.
  repository: ""
  tag: 2.2.0
  # Java version of the image: 17, 21 or 25. When set, "-jdk<javaVersion>" is
  # appended to the tag. When empty, the tag is used as is (the image default is Java 17).
  javaVersion: 25
  pullPolicy: IfNotPresent
  pullSecrets: []
  command: []
  # When set, the args are passed as they are and the start options in
  # "operaton" below are ignored.
  args: []

# Start options of the "operaton" distribution (ignored for tomcat and wildfly).
# For more details: https://github.com/operaton/operaton-docker#startup-options
operaton:
  # Web apps (Cockpit, Tasklist, Admin). The default probes check /operaton/,
  # so adjust them when the web apps are disabled.
  webapps: true
  # REST API at /engine-rest.
  rest: true
  # Swagger UI at /swaggerui/index.html.
  # Note that the REST API does not require authentication by default.
  swaggerUi: false
  # Invoice example application.
  example: false
  # Use the configuration file configuration/production.yml.
  production: false

# New web apps (technical preview since Operaton 2.2.0).
# When enabled, they are served at "/", the web apps at "/operaton/" stay available.
webappsNeo:
  enabled: false

# Extra environment variables to customize the deployment.
# For more details: https://github.com/operaton/operaton-docker
extraEnvs: []
# Example:
# - name: DB_VALIDATE_ON_BORROW
#   value: false

# Extra containers to have sidecars
extraContainers: []

persistence:
  # Storage class for the PVC.
  # If set to "-", storageClassName will be set to "", disabling dynamic provisioning.
  # If empty, no storageClassName is set (cluster default is used).
  storageClass: ""
  # Size of the PVC.
  size: 256Mi

# By default H2 database is used, which is handy for demos and tests,
# however, H2 is not supported in a clustered scenario.
# So for real-world workloads, an external database like PostgreSQL should be used.
database:
  driver: org.h2.Driver
  url: jdbc:h2:./operaton-h2-dbs/process-engine
  credentialsSecretEnabled: true
  credentialsSecretName: ""
  credentialsSecretKeys:
    username: DB_USERNAME
    password: DB_PASSWORD

service:
  enabled: true
  annotations: {}
  port: 8080
  portName: http
  protocol: TCP
  type: ClusterIP
  # NodePort example.
  # type: NodePort
  # nodePort: 30080
  # LoadBalancer example.
  # type: LoadBalancer
  # loadBalancerIP: 0.0.0.0

# Prometheus JMX exporter, only supported by the tomcat and wildfly distributions.
metrics:
  enabled: false
  service:
    enabled: true
    port: 9404
    portName: metrics
    protocol: TCP
    type: ClusterIP
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/path: "/"
      prometheus.io/port: "9404"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# The StartupProbe works with Kubernetes >= 1.6
startupProbe:
  enabled: false
  config:
    httpGet:
      path: /operaton/
      port: http
    initialDelaySeconds: 120
    periodSeconds: 60

readinessProbe:
  enabled: true
  config:
    httpGet:
      path: /operaton/
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3

# An arbitrary use of livenessProbe could make a lot of service interruption, use it wisely.
livenessProbe:
  enabled: false
  config:
    httpGet:
      path: /operaton/
      port: http
    initialDelaySeconds: 120
    periodSeconds: 60

ingress:
  enabled: false
  annotations:
    {}
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: operaton.local
      paths:
        - /
  tls: []
  #  - secretName: operaton-tls
  #    hosts:
  #      - operaton.local

# Recreate the pods on any install, no matter if anything has changed.
# Which is useful to recreate the pod if the image tag has not changed.
recreatePods: false

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
    - ALL

resources:
  limits:
    cpu: 1
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

extraVolumeMounts:
  []
# - name: dummy-volume
#   mountPath: /dummy/volume

extraVolumes:
  []
# - name: dummy-volume
  # hostPath:
  # path: /tmp/dummy-volume

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  cpuUtilizationPercentage: 80
  # memoryUtilizationPercentage:

nodeSelector: {}

tolerations: []

affinity: {}

tests:
  annotations: {}
